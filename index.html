<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feira de Projetos: água, clima e sustentabilidade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo">
  <p>Feira de projetos</p>
  <h1>Água, clima e sustentabilidade</h1>
  <p>Oito turmas, oito projetos. Leia o resumo e dê sua nota depois da apresentação.</p>
</header>
<main>
  <ul class="lista" id="lista"></ul>
</main>
<script src="projetos.js"></script>
<script>
document.getElementById("lista").innerHTML = PROJETOS.map(function (p) {
  return '<li><a href="turma-' + p.id + '.html"><b>' + p.turma + '</b><span>' + p.tema + '</span></a></li>';
}).join("");
</script>
</body>
</html>
